name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://hearth:hearth@localhost:5434/hearth
      DATABASE_READ_URL: postgres://hearth:hearth@localhost:5434/hearth
      SESSION_SECRET: ci-session-secret-value
      WEBHOOK_SECRET: ci-webhook-secret-value
      COACH_RETENTION_DAYS: "30"
      COACH_ADAPTER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:seed
      - run: pnpm test:e2e
